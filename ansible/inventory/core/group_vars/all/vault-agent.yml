---
vault_agent_user: "root"
vault_agent_group: "root"
vault_agent_vault_addr: "https://vault.secrets.internal"
vault_agent_approle: 'elastic-agent'
vault_agent_templates:
  - core-chain

vault_agent_create_directories:
  - /etc/pki/homelab/certs

vault_agent_wait_for_certs:
  - "/etc/pki/homelab/certs/core-chain.crt"
