---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  values:
    database:
      type: postgresql
      existingSecret: "vaultwarden-postgres-app"
      existingSecretKey: "uri"
    ingress:
      enabled: true
      class: "nginx"
      tlsSecret: vaultwarden-cert-tls
      hostname: pass.redstone
      allowList: "192.168.178.0/24"
