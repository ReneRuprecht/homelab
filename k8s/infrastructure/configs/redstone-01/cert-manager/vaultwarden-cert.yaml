---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-cert
  namespace: vaultwarden
spec:
  secretName: vaultwarden-cert-tls
  commonName: pass.redstone
  dnsNames:
    - pass.redstone
  issuerRef:
    name: pki-int-redstone
    kind: ClusterIssuer
  privateKey:
    algorithm: RSA
    size: 4096
